<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#16120e" />
<title>說出口</title>
<style>
:root{--ink:#16120e;--paper:#f3eadf;--seal:#c4513c;--muted:#8a7b6e;--line:#3a312b;--good:#d7b15a;--card:#221c18}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:"Songti TC","PMingLiU",serif;padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
.app{max-width:460px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center}.mark{width:46px;height:46px;border:1.5px solid var(--seal);color:var(--seal);display:grid;place-items:center;transform:rotate(-8deg);border-radius:6px}
.brand{display:flex;gap:10px;align-items:center}.brand b{letter-spacing:.18em;font-weight:500}.brand span,.stats{color:var(--muted);font-size:12px}
h1{font-weight:500;letter-spacing:.12em} .lead{line-height:1.7;color:#d9cbbd}
button{font-family:inherit;cursor:pointer}.go,.ghost{width:100%;border-radius:12px;padding:14px;letter-spacing:.08em}
.go{background:var(--seal);color:#fff8f3;border:0;font-size:17px}.ghost{background:transparent;color:#d9cbbd;border:1px solid var(--line);margin-top:8px}
.stage{color:var(--seal);letter-spacing:.16em;font-size:13px}.hud{display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;line-height:1.85;font-size:18px;min-height:120px}
.now{color:var(--good);border-bottom:1px solid var(--good)}.done{color:#d9cbbd}.wait{color:#5c5148}
.hint{color:var(--muted);font-size:13px;line-height:1.6}.seal{width:132px;height:132px;border-radius:24px;border:2px solid var(--seal);background:#2a211c;color:var(--seal);font-size:28px;letter-spacing:.2em;display:block;margin:18px auto}
.slot{border:1px dashed #6a5348;border-radius:12px;padding:10px;margin-top:8px;color:var(--muted);background:#1c1714}.slot b{display:block;color:var(--seal);font-size:12px;letter-spacing:.12em;font-weight:500}.slot.on{color:var(--paper);border-style:solid}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.chip{border:1px solid #6a5348;background:#241e1a;color:var(--paper);border-radius:999px;padding:8px 12px}.chip:disabled{opacity:.35}.bad{color:#e7b2a8}
.miss{color:#e7b2a8}.ok{color:var(--good)}.center{text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><div class="mark">說</div><div><b>說出口</b><br><span>三關印記</span></div></div><div class="stats" id="stats"></div></div>
  <div id="screen"></div>
</div>
<script>
const KEY="shuochukou-game-v2";
const state=Object.assign({streak:0,last:"",best:0,clears:0},JSON.parse(localStorage.getItem(KEY)||"{}"));
let run=null;
const passages=["中午那碗麵端上來的時候，碗邊是燙的。我先喝了一口湯，才開始吃麵。其實我想說的不是味道。我想說的是，這一次沒有白等。","晚上回家，我在門口停了一下。濕鞋子先拿開，再把自己的鞋擺正。東西沒有歸位，句子也沒有歸位。先做拿得起來的事。","有一句話我昨天沒有說。不是不能說，是解釋太多。今天我把它收成一句：我想把這件事做完，再談下一步。說完要停住。"];
const retells=[{scene:"今天早上咖啡灑了。",cards:[{slot:"發生了什麼",text:"咖啡灑在桌上。"},{slot:"我做了什麼",text:"我先擦桌，再重倒一杯。"},{slot:"感覺",text:"有點煩，可是沒有因此晚到。"},{slot:"trap",text:"照念：咖啡因意外傾覆於桌面。"}]},{scene:"門口有一雙濕鞋。",cards:[{slot:"發生了什麼",text:"門口有一雙濕鞋疊在一起。"},{slot:"我做了什麼",text:"我把它拿到通風的地方。"},{slot:"感覺",text:"很小，但句子終於有地方放。"},{slot:"trap",text:"照念：鞋履濕潤之狀態需要被處理。"}]}];
const questions=[{q:"你今天最開心的一件事是什麼？",answer:["中午那碗麵是熱的。","把門口的鞋擺正了。"],example:["昨天同一家是涼的，今天靠窗。","濕的那雙被我拿到通風處。"],reason:["開心的是這次沒有白等。","拿得起來的事，我做完了。"],trap:["還好。","就那樣。","你知道我意思吧。"]},{q:"如果只能留一句話給明天的自己？",answer:["先把一句話說完再停。","不要用還好開頭。"],example:["今天第三遍才像說給人聽。","上次一開口就在解釋。"],reason:["停住，對方才有位子答。","空話會把真正的答案埋住。"],trap:["看看再說。","可能吧。","各方面都還可以。"]}];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function today(){return new Date().toISOString().slice(0,10)}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}
function stats(){document.getElementById("stats").innerHTML="連續 <span class=ok>"+state.streak+"</span> 天<br>最佳 "+state.best}
function screen(h){document.getElementById("screen").innerHTML=h;document.querySelectorAll("[data-act]").forEach(el=>el.onclick=()=>actions[el.dataset.act](el))}
const actions={start(){begin(true)},practice(){begin(false)},tap(){onTap()},pick(el){onPick(el)},home(){title()}};
function title(){stats();screen('<h1>把話說清楚</h1><p class="lead">第一關點在該停的地方。第二關排成自己的三句。第三關先答案，再例子，最後原因。空話不要點。</p><button class="go" data-act="start">'+(state.last===today()?"今天再闖一次":"開始今日三關")+'</button><button class="ghost" data-act="practice">只練一局，不計連續</button>')}
function begin(daily){run={daily,stage:1,score:0,combo:0,lives:3,cursor:0,hit:false,passage:passages[Math.floor(Math.random()*passages.length)],retell:retells[Math.floor(Math.random()*retells.length)],question:questions[Math.floor(Math.random()*questions.length)],slots:{},used:{},left:25,why:""};stage1()}
function stage1(){run.stage=1;run.cursor=0;draw1();run.tick=setInterval(()=>{run.cursor++;if(run.cursor>=run.passage.length){clearInterval(run.tick);if(run.lives>0)stage2();return}const prev=run.passage[run.cursor-1];if("，。".includes(prev)&&!run.hit){miss("該停的地方沒點");if(run.lives<=0)return}run.hit=false;draw1()},420)}
function draw1(){const text=run.passage.split("").map((ch,i)=>'<span class="'+(i<run.cursor?"done":i===run.cursor?"now":"wait")+'">'+ch+"</span>").join("");screen('<div class="hud"><div class="stage">第一關 · 停頓</div><div>'+run.score+"</div></div><p>印 "+ "印".repeat(run.lives)+'</p><div class="card">'+text+'</div><p class="hint">逗號、句號亮起時點停。點早了會少一枚印。</p><button class="seal" id="seal" data-act="tap">停</button><p class="miss">'+(run.why||"")+"</p>")}
function onTap(){if(!run||run.stage!==1)return;const ch=run.passage[run.cursor]||"";if("，。".includes(ch)){run.hit=true;run.combo++;run.score+=10+run.combo*2;run.why=""}else miss("這裡不用停");draw1()}
function miss(why){run.combo=0;run.lives--;run.why=why;if(run.lives<=0){clearInterval(run.tick);fail(why)}}
function stage2(){run.stage=2;run.order=["發生了什麼","我做了什麼","感覺"];run.pool=run.retell.cards.slice().sort(()=>Math.random()-.5);run.slots={};run.used={};draw2()}
function draw2(){const slots=run.order.map(n=>'<div class="slot '+(run.slots[n]?"on":"")+'"><b>'+n+"</b>"+(run.slots[n]||"點下面的句子")+"</div>").join("");const chips=run.pool.map((c,i)=>'<button class="chip '+(c.slot==="trap"?"bad":"")+'" data-act="pick" data-i="'+i+'" '+(run.used[i]?"disabled":"")+">"+c.text+"</button>").join("");screen('<div class="hud"><div class="stage">第二關 · 自己的三句</div><div>'+run.score+'</div></div><div class="card">'+run.retell.scene+'</div><p class="hint">順序是發生、我做了什麼、感覺。照念的那張不能用。</p>'+slots+'<div class="chips">'+chips+'</div><p class="miss">'+(run.why||"")+"</p>")}
function onPick(el){if(run.stage===2){const card=run.pool[+el.dataset.i];if(card.slot==="trap"){run.score=Math.max(0,run.score-8);run.why="這是照念，不是自己的話";draw2();return}const next=run.order.find(n=>!run.slots[n]);if(card.slot!==next){run.score=Math.max(0,run.score-5);run.why="順序不對";draw2();return}run.slots[next]=card.text;run.used[+el.dataset.i]=true;run.score+=15;run.why="";if(run.order.every(n=>run.slots[n]))stage3();else draw2()}else if(run.stage===3){const kind=el.dataset.kind,text=el.dataset.text;if(kind==="trap"){run.score=Math.max(0,run.score-10);run.why="空話不能當答案";draw3();return}run.slots[kind]=text;run.score+=12;run.why="";if(run.slots.answer&&run.slots.example&&run.slots.reason){clearInterval(run.tick);win();return}draw3()}}
function stage3(){run.stage=3;run.slots={};run.left=25;draw3();run.tick=setInterval(()=>{run.left--;const t=document.getElementById("timer");if(t)t.textContent=run.left;if(run.left<=0){clearInterval(run.tick);fail("時間到，還沒有三句")}},1000)}
function group(kind,label,list){return "<b>"+label+'</b><div class="chips">'+list.map(text=>'<button class="chip" data-act="pick" data-kind="'+kind+'" data-text="'+text+'">'+text+"</button>").join("")+"</div>"}
function draw3(){const q=run.question;screen('<div class="hud"><div class="stage">第三關 · 當場回答</div><div class="ok" id="timer">'+run.left+'</div></div><div class="card">'+q.q+'</div><p class="hint">先答案，再例子，最後原因。</p><div class="slot '+(run.slots.answer?"on":"")+'"><b>直接回答</b>'+(run.slots.answer||"還沒有")+'</div><div class="slot '+(run.slots.example?"on":"")+'"><b>一個例子</b>'+(run.slots.example||"還沒有")+'</div><div class="slot '+(run.slots.reason?"on":"")+'"><b>一句原因</b>'+(run.slots.reason||"還沒有")+"</div>"+group("answer","答案",q.answer)+group("example","例子",q.example)+group("reason","原因",q.reason)+group("trap","不要點",q.trap)+'<p class="miss">'+(run.why||"")+"</p>")}
function win(){run.score+=run.left*2;state.best=Math.max(state.best,run.score);state.clears++;let note="這局不計連續。";if(run.daily&&state.last!==today()){state.streak=state.last===yesterday()||!state.last?state.streak+1:1;state.last=today();note="今日三關蓋印。連續 "+state.streak+" 天。"}save();stats();const lines=[run.slots.answer,run.slots.example,run.slots.reason].map(x=>"・ "+x).join("<br>");screen('<div class="center"><div class="mark" style="margin:12px auto">說</div><h1>說出口了</h1><p class="ok">'+run.score+' 分</p><p class="lead">'+note+'</p><div class="card" style="text-align:left">'+lines+'</div><p class="hint">留下的三句，就是下次能說的庫存。</p><button class="go" data-act="home">回到印記</button></div>')}
function fail(why){if(run.tick)clearInterval(run.tick);save();screen('<div class="center"><h1>這句還沒送完</h1><p class="miss">'+why+'</p><p class="lead">分數 '+run.score+'。該停沒停、照念、或用空話開頭，就不算清楚。</p><button class="go" data-act="start">再闖一次</button><button class="ghost" data-act="home">回到印記</button></div>')}
title();
</script>
</body>
</html>
