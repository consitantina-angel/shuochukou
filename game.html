<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#16120e" />
<title>說出口 · 三關印記</title>
<style>
  :root {
    --ink:#16120e; --paper:#f3eadf; --seal:#c4513c; --seal-deep:#8d3224;
    --muted:#8a7b6e; --line:#3a312b; --good:#d7b15a; --card:#221c18;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--ink); color:var(--paper); }
  body {
    font-family: "Songti TC", "PMingLiU", "Noto Serif TC", serif;
    min-height: 100dvh;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
  }
  button, .chip { font-family: inherit; }
  .app { max-width: 460px; margin: 0 auto; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand img { width:46px; height:46px; border-radius:8px; object-fit:cover; transform:rotate(-6deg); }
  .brand b { display:block; letter-spacing:.18em; font-size:18px; font-weight:500; }
  .brand span { color:var(--muted); font-size:12px; letter-spacing:.08em; }
  .stats { text-align:right; font-size:12px; color:var(--muted); line-height:1.55; }
  .stats em { color:var(--good); font-style:normal; }
  .screen { margin-top: 22px; }
  h1 { font-size: 28px; font-weight: 500; letter-spacing:.12em; margin: 8px 0; }
  .lead { color:#d9cbbd; line-height:1.7; font-size:15px; }
  .seal-btn, .go, .ghost {
    border:0; color:var(--paper); cursor:pointer;
  }
  .go {
    width:100%; margin-top:14px; background:var(--seal); color:#fff8f3;
    padding:14px 16px; border-radius:12px; font-size:17px; letter-spacing:.12em;
  }
  .ghost {
    width:100%; margin-top:8px; background:transparent; color:#d9cbbd;
    border:1px solid var(--line); padding:12px; border-radius:12px; letter-spacing:.08em;
  }
  .hud { display:flex; justify-content:space-between; align-items:end; margin-bottom:12px; }
  .stage { color:var(--seal); letter-spacing:.16em; font-size:13px; }
  .score { font-size:22px; letter-spacing:.06em; }
  .bar { height:4px; background:#2b241f; border-radius:99px; overflow:hidden; margin:8px 0 14px; }
  .bar i { display:block; height:100%; background:var(--seal); width:0; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; line-height:1.85; font-size:18px; min-height:140px;
  }
  .card .now { color:var(--good); border-bottom:1px solid var(--good); }
  .card .done { color:#d9cbbd; }
  .card .wait { color:#5c5148; }
  .hint { color:var(--muted); font-size:13px; line-height:1.6; margin:10px 0; }
  .pad { display:grid; place-items:center; margin-top:18px; }
  .seal-btn {
    width:148px; height:148px; border-radius:28px; background:#2a211c;
    border:2px solid var(--seal); color:var(--seal); font-size:28px; letter-spacing:.2em;
    box-shadow: inset 0 0 0 6px rgba(196,81,60,.25);
  }
  .seal-btn.hot { background:var(--seal); color:#fff8f3; transform:scale(.96); }
  .lives { letter-spacing:.2em; color:var(--seal); }
  .slots { display:grid; gap:8px; }
  .slot {
    border:1px dashed #6a5348; border-radius:12px; min-height:52px; padding:10px 12px;
    color:var(--muted); background:#1c1714;
  }
  .slot b { display:block; color:var(--seal); font-weight:500; font-size:12px; letter-spacing:.12em; }
  .slot.filled { border-style:solid; color:var(--paper); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip {
    border:1px solid #6a5348; background:#241e1a; color:var(--paper);
    border-radius:999px; padding:8px 12px; font-size:14px;
  }
  .chip.bad { border-color:#6e3a32; color:#e7b2a8; }
  .chip:disabled { opacity:.35; }
  .timer { font-variant-numeric: tabular-nums; color:var(--good); }
  .result { text-align:center; }
  .result img { width:120px; height:120px; object-fit:cover; border-radius:12px; }
  .ok { color:var(--good); }
  .miss { color:#e7b2a8; }
  .small { font-size:13px; color:var(--muted); line-height:1.6; }
.mark{width:46px;height:46px;border:1.5px solid var(--seal);color:var(--seal);display:grid;place-items:center;transform:rotate(-8deg);border-radius:6px}.mark.big{width:92px;height:92px;margin:8px auto 12px;font-size:28px}</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="mark">說</div>
      <div><b>說出口</b><span>三關印記</span></div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="screen" id="screen"></div>
</div>

}

function today() { return new Date().toISOString().slice(0,10); }

}

function renderStats() {
  document.getElementById("stats").innerHTML = "連續 <em>" + state.streak + "</em> 天<br>最佳 <em>" + state.best + "</em>";
}
function screen(html) { document.getElementById("screen").innerHTML = html; bind(); }
function bind() {
  document.querySelectorAll("[data-act]").forEach(el => el.onclick = () => actions[el.dataset.act](el));
}

const actions = {
  start() { begin(true); },
  practice() { begin(false); },
  tap() { onTap(); },
  pick(el) { onPick(el); },
  home() { title(); }
};

function title() {
  renderStats();
  const done = state.last === today();
  screen(`
    <h1>把話說清楚</h1>
    <p class="lead">三關一連。第一關點在該停的地方。第二關把一件事排成自己的三句。第三關被問到就答，不准用空話開頭。</p>
    <button class="go" data-act="start">${done ? "今天再闖一次" : "開始今日三關"}</button>
    <button class="ghost" data-act="practice">只練一局，不計連續</button>
    <p class="small">已通關 ${state.clears} 次。進度留在這台手機裡。</p>
  `);
}

function begin(daily) {
  run = {
    daily, stage:1, score:0, combo:0, lives:3, idx:0, cursor:0,
    passage: passages[Math.floor(Math.random()*passages.length)],
    retell: retells[Math.floor(Math.floor(Math.random()*retells.length))],
    question: questions[Math.floor(Math.random()*questions.length)],
    slots: {}, used: {}, timer: 25, tick: null, picked: []
  };
  run.retell = retells[Math.floor(Math.random()*retells.length)];
  stage1();
}

function stage1() {
  run.stage = 1; run.cursor = 0; run.combo = 0;
  drawStage1();
  run.tick = setInterval(() => {
    run.cursor += 1;
    if (run.cursor >= run.passage.length) { clearInterval(run.tick); finishStage1(); return; }
    const prev = run.passage[run.cursor - 1];
    if ("，。".includes(prev) && !run.hit) { miss("該停的地方沒點"); if (run.lives <= 0) return; }
    run.hit = false;
    drawStage1();
  }, 420);
}
function drawStage1() {
  const text = run.passage.split("").map((ch, i) => {
    const cls = i < run.cursor ? "done" : i === run.cursor ? "now" : "wait";
    return `<span class="${cls}">${ch}</span>`;
  }).join("");
  screen(`
    <div class="hud"><div><div class="stage">第一關 · 停頓</div><div class="lives">${"印".repeat(run.lives)}</div></div><div class="score">${run.score}</div></div>
    <div class="bar"><i style="width:${Math.min(100, run.cursor / run.passage.length * 100)}%"></i></div>
    <div class="card">${text}</div>
    <p class="hint">逗號停半拍，句號停一拍。亮到標點時，點印。</p>
    <div class="pad"><button class="seal-btn" id="seal" data-act="tap">停</button></div>
  `);
}
function onTap() {
  if (!run || run.stage !== 1) return;
  const ch = run.passage[run.cursor] || "";
  const btn = document.getElementById("seal");
  if (btn) { btn.classList.add("hot"); setTimeout(() => btn.classList.remove("hot"), 120); }
  if ("，。".includes(ch)) {
    run.hit = true; run.combo += 1; run.score += 10 + run.combo * 2;
  } else miss("這裡不用停");
  drawStage1();
}
function miss(why) {
  run.combo = 0; run.lives -= 1; run.why = why;
  if (run.lives <= 0) { clearInterval(run.tick); fail(why); }
}
function finishStage1() {
  if (run.lives <= 0) return;
  run.score += 20;
  stage2();
}

function stage2() {
  run.stage = 2;
  run.order = ["發生了什麼", "我做了什麼", "感覺"];
  run.pool = run.retell.cards.slice().sort(() => Math.random() - 0.5);
  run.slots = {};
  drawStage2();
}
function drawStage2() {
  const slots = run.order.map(name => {
    const text = run.slots[name] ? run.slots[name] : "點下面的句子放進來";
    return `<div class="slot ${run.slots[name] ? "filled" : ""}"><b>${name}</b>${text}</div>`;
  }).join("");
  const chips = run.pool.map((c, i) => `<button class="chip ${c.slot==="trap"?"bad":""}" data-act="pick" data-i="${i}" ${run.used[i]?"disabled":""}>${c.text}</button>`).join("");
  screen(`
    <div class="hud"><div class="stage">第二關 · 自己的三句</div><div class="score">${run.score}</div></div>
    <div class="card">${run.retell.scene}</div>
    <p class="hint">不要照念。一句發生的事，一句你做的事，一句感覺。帶著「照念」的那張不能用。</p>
    <div class="slots">${slots}</div>
    <div class="chips">${chips}</div>
    <p class="miss">${run.why || ""}</p>
  `);
}
function onPick(el) {
  if (!run) return;
  if (run.stage === 2) {
    const card = run.pool[+el.dataset.i];
    if (card.slot === "trap") { run.score = Math.max(0, run.score - 8); run.why = "這是照念，不是自己的話"; drawStage2(); return; }
    const next = run.order.find(name => !run.slots[name]);
    if (!next) return;
    if (card.slot !== next) { run.score = Math.max(0, run.score - 5); run.why = "順序是：發生、我做了什麼、感覺"; drawStage2(); return; }
    run.slots[next] = card.text; run.used[+el.dataset.i] = true; run.score += 15;
    if (run.order.every(name => run.slots[name])) { run.picked = run.order.map(name => run.slots[name]); stage3(); return; }
    drawStage2();
  } else if (run.stage === 3) {
    const kind = el.dataset.kind, text = el.dataset.text;
    if (kind === "trap") { run.score = Math.max(0, run.score - 10); run.why = "空話不能當答案"; drawStage3(); return; }
    run.slots[kind] = text; run.score += 12;
    if (run.slots.answer && run.slots.example && run.slots.reason) { clearInterval(run.tick); win(); return; }
    drawStage3();
  }
}

function stage3() {
  run.stage = 3; run.slots = {}; run.left = 25;
  drawStage3();
  run.tick = setInterval(() => {
    run.left -= 1;
    const t = document.getElementById("timer");
    if (t) t.textContent = run.left;
    if (run.left <= 0) { clearInterval(run.tick); fail("時間到，還沒有三句"); }
  }, 1000);
}
function drawStage3() {
  const q = run.question;
  const group = (kind, label, list) => `<b>${label}</b><div class="chips">${list.map(text => `<button class="chip" data-act="pick" data-kind="${kind}" data-text="${text}">${text}</button>`).join("")}</div>`;
  screen(`
    <div class="hud"><div class="stage">第三關 · 當場回答</div><div class="timer" id="timer">${run.left}</div></div>
    <div class="card">${q.q}</div>
    <p class="hint">先一句答案，再一個例子，最後一句原因。看到空話就不要點。</p>
    <div class="slot ${run.slots.answer?"filled":""}"><b>直接回答</b>${run.slots.answer || "還沒有"}</div>
    <div class="slot ${run.slots.example?"filled":""}"><b>一個例子</b>${run.slots.example || "還沒有"}</div>
    <div class="slot ${run.slots.reason?"filled":""}"><b>一句原因</b>${run.slots.reason || "還沒有"}</div>
    ${group("answer","答案", q.answer)}
    ${group("trap","不要點", q.trap)}
    ${group("example","例子", q.example)}
    ${group("reason","原因", q.reason)}
    <p class="miss">${run.why || ""}</p>
  `);
}

function fail(why) {
  if (run.tick) clearInterval(run.tick);
  save();
  screen(`
    <div class="result">
      <h1>這句還沒送完</h1>
      <p class="miss">${why}</p>
      <p class="lead">分數 ${run.score}。停錯、照念、或用空話開頭，這一關就不算清楚。</p>
      <button class="go" data-act="start">再闖一次</button>
      <button class="ghost" data-act="home">回到印記</button>
    </div>
  `);
}
